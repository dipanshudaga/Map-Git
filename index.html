<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Git</title>
<meta name="description" content="Map Git shows a GitHub repository as a map. Each branch is a column. Each commit is a card. See merges, conflicts, pull requests, and CI. Paste a link to start.">
<meta name="theme-color" content="#6d28d9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ===== Design tokens ===== */
  :root {
    /* color */
    --bg:#f6f6f3; --panel:#fff; --ink:#16161d; --ink-2:#475467; --muted:#667085; --faint:#98a2b3; --line:#e6e7eb; --fill:#f1f2f5; --fill-2:#e5e8ee;
    --accent:#4f46e5; --accent-2:#4338ca; --accent-bg:#eef2ff;
    --ok:#15803d; --okbg:#dcfce7; --bad:#cf222e; --badbg:#ffe4e6; --warn:#b45309; --warnbg:#fef3c7;
    /* spacing: 4pt steps on an 8pt grid */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --edge:16px;                 /* margin between floating UI and the screen edge */
    --bar:56px;                  /* height of the floating bars (40px control + 2 x 8px padding) */
    /* controls */
    --c:40px; --c-sm:32px;
    /* radius */
    --r1:8px; --r2:12px; --r3:16px; --pill:999px;
    /* elevation */
    --e1:0 1px 2px rgba(20,20,40,.10); --e2:0 1px 2px rgba(20,20,40,.08), 0 8px 24px rgba(20,20,40,.12); --e3:0 8px 24px rgba(20,20,40,.20);
    /* typography: 4 sizes (12 / 14 / 16 / 20), 3 weights (400 / 600 / 700) */
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --t-heading:700 20px/28px var(--font);        /* panel titles, big numbers */
    --t-title:600 16px/24px var(--font);          /* commit messages, branch names, popover titles */
    --t-label:600 14px/20px var(--font);          /* buttons, rows, field labels */
    --t-body:400 14px/20px var(--font);           /* running text */
    --t-caption:400 12px/16px var(--font);        /* dates, helper text */
    --t-caption-strong:600 12px/16px var(--font); /* chips, badges */
    --t-overline:700 12px/16px var(--font);       /* section labels, tags (uppercase, +6% tracking) */
    --t-code:400 12px/16px var(--mono); --t-code-strong:600 12px/16px var(--mono);
  }
  * { box-sizing:border-box }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:var(--t-body); -webkit-font-smoothing:antialiased }
  button,select,input { font:inherit; color:inherit }
  button { cursor:pointer; border:0; background:transparent; padding:0 }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  code { font:var(--t-code) }
  b { font-weight:600 }
  h2,h3,h4,p,ul,dl { margin:0 }

  /* icons: one stroke set, three sizes */
  .i { width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
  .i.xs { width:12px; height:12px } .i.lg { width:20px; height:20px }

  /* ===== Chrome: 16px edge margin, 56px bars, 8px inner padding ===== */
  .float { position:fixed; z-index:5; background:var(--panel); border-radius:var(--r3); box-shadow:var(--e2) }
  #tl { top:var(--edge); left:var(--edge); height:var(--bar); display:flex; align-items:center; gap:var(--s2); padding:0 var(--s2) 0 var(--s3) }
  #tl .logo { display:flex; align-items:center; gap:var(--s2); font:var(--t-title); font-weight:700; white-space:nowrap }
  .rb { height:var(--c); padding:0 var(--s3); border-radius:var(--r2); background:var(--fill); font:var(--t-label); max-width:280px; display:inline-flex; align-items:center; gap:var(--s2) } .rb:hover,.rb.on { background:var(--fill-2) }
  .rb #repoName { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  body.loading #reload svg { animation:spin .8s linear infinite }
  /* loading: a bar across the top, the map dims, and a clear message in the middle */
  #loadbar { position:fixed; top:0; left:0; right:0; height:3px; z-index:30; display:none; overflow:hidden; background:var(--accent-bg) }
  #loadbar::after { content:''; position:absolute; top:0; bottom:0; width:35%; background:var(--accent); border-radius:3px; animation:slide 1.1s ease-in-out infinite }
  @keyframes slide { from { left:-35% } to { left:100% } }
  #loading { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:25; display:none; align-items:center; gap:var(--s3); padding:var(--s4) var(--s6); background:var(--panel); border-radius:var(--pill); box-shadow:var(--e3); font:var(--t-title); color:var(--ink) }
  #loading i { width:20px; height:20px; border:3px solid var(--accent-bg); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite }
  @keyframes spin { to { transform:rotate(360deg) } }
  body.loading #loadbar { display:block } body.loading #loading { display:flex }
  body.loading #world { opacity:.4 } #world { transition:opacity .2s }
  @media (prefers-reduced-motion:reduce) { #loadbar::after, #loading i { animation-duration:3s } }
  #zoom { right:var(--edge); top:var(--edge); height:var(--bar); display:flex; align-items:center; gap:var(--s1); padding:0 var(--s2) }
  #zl { min-width:56px; text-align:center; color:var(--muted); font:var(--t-label); font-variant-numeric:tabular-nums }

  /* buttons: 40px controls, 12px side padding, 8px icon gap */
  .tb { height:var(--c); padding:0 var(--s3); border-radius:var(--r2); font:var(--t-label); white-space:nowrap; position:relative; display:inline-flex; align-items:center; justify-content:center; gap:var(--s2) }
  .tb.icon { width:var(--c); padding:0 }
  .tb:hover,.tb.on { background:var(--fill) } .tb:disabled { opacity:.5; cursor:progress }
  .tb.primary { background:var(--accent); color:#fff } .tb.primary:hover { background:var(--accent-2) }
  .badge { min-width:20px; height:20px; padding:0 6px; border-radius:var(--pill); background:var(--accent); color:#fff; font:var(--t-caption-strong); display:inline-grid; place-items:center }
  .sep { width:1px; height:24px; background:var(--line); margin:0 var(--s1); flex:none }

  #viewport { position:fixed; inset:0; cursor:grab; touch-action:none; overflow:hidden }
  #viewport.drag { cursor:grabbing }
  #world { position:absolute; left:0; top:0; transform-origin:0 0 }
  #edges { position:absolute; left:0; top:0; overflow:visible; pointer-events:none }

  /* ===== Canvas items: sizes are multiples of 8 (card 256x128, title 256x128, PR 256x120) ===== */
  .head { position:absolute; width:256px; height:128px; border-radius:var(--r3); padding:var(--s3) var(--s4); color:#fff; cursor:pointer; box-shadow:var(--e2); user-select:none }
  .head .n { display:flex; align-items:center; gap:var(--s2); font:var(--t-title); font-weight:700 }
  .head .n span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .head .sub { display:flex; flex-wrap:wrap; gap:var(--s1); margin-top:var(--s2) }
  .head .when { margin-top:var(--s2); font:var(--t-caption); opacity:.9 }
  .head.stale { filter:saturate(.55) } .head.dragging,.card.dragging,.pr.dragging { cursor:grabbing; z-index:50 }
  .chip,.pill { display:inline-flex; align-items:center; gap:var(--s1); height:20px; padding:0 var(--s2); border-radius:var(--pill); font:var(--t-caption-strong); white-space:nowrap }
  .chip { background:rgba(255,255,255,.24) }
  .chip.ok { background:#fff; color:var(--ok) } .chip.bad { background:#fff; color:var(--bad) } .chip.warn { background:#fff; color:var(--warn) }

  .pr { position:absolute; width:256px; height:120px; border-radius:var(--r2); padding:var(--s3); background:#fff; border:2px solid; cursor:pointer; box-shadow:var(--e1); user-select:none }
  .pr .t { display:flex; align-items:center; gap:var(--s2); height:20px; font:var(--t-caption-strong) }
  .pr .m { margin-top:var(--s2); font:var(--t-label); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  .pr .d { position:absolute; left:var(--s3); bottom:var(--s3); font:var(--t-caption); color:var(--muted) }

  .card { position:absolute; width:256px; height:128px; border-radius:var(--r2); padding:var(--s3); border:2px solid; cursor:pointer; user-select:none; box-shadow:var(--e1); transition:box-shadow .12s }
  .card:hover { box-shadow:var(--e3) }
  .card.sel,.pr.sel,.head.sel { box-shadow:0 0 0 4px rgba(79,70,229,.5), var(--e3) }
  .card.merge { border-width:3px }
  .card .r1 { display:flex; justify-content:space-between; align-items:center; height:16px; font:var(--t-caption); color:var(--ink-2) }
  .card .r1 > span:last-child { display:inline-flex; align-items:center; gap:var(--s2) }
  .card .h { font:var(--t-code-strong) }
  .card .m { margin-top:var(--s2); font:var(--t-title); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word }
  .card .a { position:absolute; left:var(--s3); right:var(--s3); bottom:var(--s3); height:20px; display:flex; align-items:center; gap:var(--s2); font:var(--t-caption); color:var(--ink-2); overflow:hidden; white-space:nowrap }
  .card .a b { font-weight:400; overflow:hidden; text-overflow:ellipsis }
  .av { width:20px; height:20px; border-radius:50%; color:#fff; font:var(--t-caption-strong); display:grid; place-items:center; flex:none }
  .tag { margin-left:auto; flex:none; display:inline-flex; align-items:center; height:20px; padding:0 var(--s2); border-radius:var(--pill); background:#fff; font:var(--t-overline); letter-spacing:.06em }
  .card.fresh::after { content:"NEW"; position:absolute; top:-10px; right:var(--s3); height:20px; padding:0 var(--s2); display:flex; align-items:center; border-radius:var(--pill); background:var(--ok); color:#fff; font:var(--t-overline); letter-spacing:.06em; box-shadow:var(--e1) }
  .tags { position:absolute; left:var(--s3); top:-10px; display:flex; gap:var(--s1); z-index:2 }
  .tagchip { display:inline-flex; align-items:center; gap:var(--s1); height:20px; padding:0 var(--s2); border-radius:var(--pill); background:var(--fill); color:var(--ink-2); border:1px solid #cbd5e1; font:var(--t-caption-strong); white-space:nowrap; max-width:152px; overflow:hidden; text-overflow:ellipsis; box-shadow:var(--e1) }
  .ci { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; color:#fff; flex:none }
  .ci.success { background:var(--ok) } .ci.failure { background:var(--bad) } .ci.pending { background:#d4a006 }
  .more { position:absolute; width:256px; min-height:40px; border-radius:var(--pill); border:2px dashed; background:#fff; font:var(--t-label); display:flex; align-items:center; justify-content:center; gap:var(--s2); cursor:pointer }
  .more:hover { background:var(--fill) } .more.note { cursor:default; color:var(--muted); border-color:#c9c9d1; font:var(--t-caption); text-align:center; padding:var(--s2) var(--s3) } .more.note:hover { background:#fff }
  .head,.card,.pr,.more { transition:opacity .25s }

  /* ===== Inspector: 400px wide, 24px padding, 24px between sections ===== */
  #side { top:calc(var(--edge) + var(--bar) + var(--s2)); right:var(--edge); max-height:calc(100vh - 2*var(--edge) - var(--bar) - var(--s2)); width:400px; overflow:auto; display:none }
  #side.open { display:block }
  #side .band { padding:var(--s5); color:#fff; position:relative }
  .overline,#side h4,.ph,#side .band .kind { font:var(--t-overline); letter-spacing:.06em; text-transform:uppercase; color:var(--faint) }
  #side .band .kind { color:#fff; opacity:.9 }
  #side .band h2 { margin-top:var(--s2); font:var(--t-heading); word-break:break-word; padding-right:var(--s6) }
  #side .x { position:absolute; top:var(--s3); right:var(--s3); width:var(--c-sm); height:var(--c-sm); border-radius:var(--r1); color:#fff; display:grid; place-items:center } #side .x:hover { background:rgba(255,255,255,.2) }
  #side .body { padding:0 var(--s5) var(--s5) }
  #side .meta { display:flex; align-items:center; gap:var(--s2); margin-top:var(--s4); color:var(--muted); font:var(--t-body) } #side .meta b { color:var(--ink); font:var(--t-label) } #side .meta span:last-child::before { content:"·"; margin-right:var(--s2) }
  #side .chips { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); margin-top:var(--s3) } #side .chips .pill { height:24px; padding:0 var(--s3) } #side .arrow { color:var(--faint); display:inline-flex; transform:rotate(-90deg) }
  #side .rows { margin-top:var(--s4); padding:var(--s1) var(--s4); border-radius:var(--r2); box-shadow:0 0 0 1px var(--line) inset } #side .r { display:flex; justify-content:space-between; align-items:center; gap:var(--s4); min-height:40px; padding:var(--s1) 0; border-top:1px solid var(--line) } #side .r:first-child { border-top:0 }
  #side .r code { font-size:14px; line-height:20px }
  #side .r.w { flex-direction:column; align-items:flex-start; gap:var(--s2); padding:var(--s3) 0 } #side .r.w > div { justify-content:flex-start; text-align:left }
  #side .r > span { color:var(--muted); flex:none } #side .r > div { display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; justify-content:flex-end; text-align:right; word-break:break-word } #side .m { color:var(--muted); font-weight:400 }
  #side .mini { width:24px; height:24px; border-radius:var(--r1); display:grid; place-items:center; color:var(--faint) } #side .mini:hover { background:var(--fill); color:var(--ink) }
  #side .tiles { display:grid; grid-template-columns:1fr 1fr; gap:var(--s3); margin-top:var(--s4) }
  #side .tile { border-radius:var(--r2); background:var(--fill); padding:var(--s3) var(--s4) var(--s3) } #side .tile b { display:block; font:var(--t-heading); font-size:28px; line-height:34px; font-variant-numeric:tabular-nums }
  #side .tile span { display:inline-flex; align-items:center; gap:var(--s1); color:var(--muted); font:var(--t-caption) } #side .tile .tipbtn { margin-left:0 }
  #side .two { display:flex; flex-direction:column; align-items:flex-end; min-width:0 } #side .two small { font:var(--t-caption); color:var(--muted); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  #side .idc { cursor:pointer; border-radius:var(--r1); padding:2px 6px; margin-right:-6px } #side .idc:hover { background:var(--fill) }
  #side .st { display:flex; gap:var(--s3); align-items:flex-start; padding:var(--s3) var(--s4); border-radius:var(--r2); margin-top:var(--s3); font:var(--t-body) } #side .st > .i, #side .st summary > .i:first-child { flex:none; margin-top:2px } #side .st b { font:var(--t-label); display:inline-flex; align-items:center } #side .st span { display:block; margin-top:2px; opacity:.85 }
  #side .st.ok { background:var(--okbg); color:#14532d } #side .st.bad { background:var(--badbg); color:#7f1d1d } #side .st.warn { background:var(--warnbg); color:#78350f } #side .st.info { background:var(--fill); color:var(--ink-2) }
  #side details.st { display:block } #side details.st summary { display:flex; align-items:center; gap:var(--s3); cursor:pointer; list-style:none } #side details.st summary > b { flex:1 } #side details.st .checks { margin-top:var(--s3); background:rgba(255,255,255,.7); box-shadow:none }
  #side summary::-webkit-details-marker { display:none } #side details[open] > summary > .i:last-child { transform:rotate(180deg) }
  #side .sec { margin-top:var(--s4); border-top:1px solid var(--line) } #side .sec summary { display:flex; align-items:center; gap:var(--s2); height:44px; cursor:pointer; list-style:none; font:var(--t-label); color:var(--ink-2) } #side .sec summary:hover { color:var(--ink) } #side .sec summary em { font-style:normal; color:var(--muted); font:var(--t-caption-strong); background:var(--fill); border-radius:var(--pill); padding:0 var(--s2); line-height:20px } #side .sec summary > .i:last-child { margin-left:auto; color:var(--faint) }
  #side .sec > .files, #side .sec > .cmdnote:first-child { margin-top:0 }
  #side .flow { display:flex; align-items:center; gap:var(--s2); margin-top:var(--s4); padding:var(--s3) var(--s4); border-radius:var(--r2); background:var(--fill); flex-wrap:wrap } #side .flow .sp { flex:1 } #side .flow .go { display:inline-flex; color:var(--faint); transform:rotate(90deg) }
  #side .btn.primary { background:var(--accent); color:#fff } #side .btn.primary:hover { background:var(--accent); filter:brightness(.92) }
  #side .btn { display:flex; align-items:center; justify-content:center; gap:var(--s2); height:var(--c); margin-top:var(--s5); border-radius:var(--r2); background:var(--fill); color:var(--ink); font:var(--t-label); text-decoration:none } #side .btn:hover { background:var(--fill-2) }
  #side h4 { margin:var(--s5) 0 var(--s2) }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:var(--s3); margin-top:var(--s5) }
  .stat { border-radius:var(--r2); padding:var(--s3) var(--s4); background:#f6f7f9 } .stat b { display:block; font:var(--t-heading); font-variant-numeric:tabular-nums } .stat span { font:var(--t-caption); color:var(--muted) }
  .bar { height:8px; border-radius:var(--pill); background:var(--fill); display:flex; overflow:hidden; margin-top:var(--s3) }
  .kv { display:grid; grid-template-columns:112px 1fr; gap:var(--s3) var(--s2); margin-top:var(--s5) } .kv dt { color:var(--muted) } .kv dd { margin:0; word-break:break-word; display:flex; flex-wrap:wrap; gap:var(--s1) var(--s2); align-items:center }
  .callout { border-radius:var(--r2); padding:var(--s4); margin-top:var(--s4) }
  .callout.info { background:var(--accent-bg) } .callout.ok { background:var(--okbg); color:#14532d } .callout.bad { background:var(--badbg); color:#7f1d1d } .callout.warn { background:var(--warnbg); color:#78350f }
  .tipbtn { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-left:var(--s1); padding:0; border-radius:50%; color:var(--faint); background:none; border:0; cursor:help; vertical-align:middle; flex:none }
  .tipbtn:hover,.tipbtn.on,.tipbtn:focus-visible { color:var(--accent); background:var(--accent-bg) } .tipbtn .i { width:14px; height:14px }
  #side .band .tipbtn { color:#fff; opacity:.85 } #side .band .tipbtn:hover,#side .band .tipbtn.on { background:rgba(255,255,255,.22); color:#fff; opacity:1 }
  #tip { position:fixed; z-index:20; width:264px; padding:var(--s3) var(--s4); border-radius:var(--r2); background:#14151a; color:#fff; font:var(--t-body); box-shadow:var(--e3); display:none }
  #tip b { display:block; font:var(--t-label); margin-bottom:var(--s1) } #tip span { display:block; color:#d4d6dd } #tip span + span { margin-top:var(--s1) }
  .callout b.t { display:flex; align-items:center; gap:var(--s2); font:var(--t-label); margin-bottom:var(--s1) }
  .files,.checks { list-style:none; padding:0; border-radius:var(--r2); box-shadow:0 0 0 1px var(--line) inset; overflow:auto }
  .files { max-height:192px }
  .files li { padding:var(--s2) var(--s3); font:var(--t-code); border-bottom:1px solid var(--line); word-break:break-all } .files li:last-child,.checks li:last-child { border:0 }
  .files li small { font:var(--t-caption); color:var(--muted) } .files li.clash { background:var(--badbg); color:#7f1d1d; font:var(--t-code-strong) }
  .checks li { display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3); font:var(--t-body); border-bottom:1px solid var(--line) } .checks a { color:inherit; text-decoration:none; display:inline-flex; align-items:center; gap:var(--s1) } .checks a:hover { text-decoration:underline }
  .link { color:var(--accent); font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:var(--s1) } .link:hover { text-decoration:underline }
  .cmdnote { font:var(--t-caption); color:var(--muted); margin:var(--s1) 0 var(--s3) }

  /* ===== Popovers: 360px wide, 16px padding, 12px gap, 16px above/below the button ===== */
  .pop { position:fixed; width:360px; padding:var(--s4); display:none; z-index:7 }
  .pop.open { display:block }
  .pop.caret::before { content:""; position:absolute; top:-6px; left:var(--cx,40px); width:12px; height:12px; background:#fff; transform:rotate(45deg); border-radius:2px }
  .pop.up.caret::before { top:auto; bottom:-6px }
  .pop h3 { font:var(--t-title); margin-bottom:var(--s3); display:flex; align-items:center; gap:var(--s2) }
  .in { display:flex; gap:var(--s2) } .in input { flex:1 1 0; min-width:0 }
  input { height:var(--c); padding:0 var(--s3); border:0; border-radius:var(--r2); box-shadow:0 0 0 1px var(--line) inset; font:var(--t-body); outline:none; background:#fff }
  input:focus { box-shadow:0 0 0 2px var(--accent) inset } input:focus-visible { outline:none }  /* one ring, not two */
  .ph { margin:var(--s5) 0 var(--s2) }
  .alert { display:flex; gap:var(--s3); margin-top:var(--s3); padding:var(--s3) var(--s4); border-radius:var(--r2); background:var(--badbg); color:#7f1d1d; font:var(--t-caption); text-align:left }
  .alert .i { flex:none; margin-top:2px; color:var(--bad) } .alert b { display:block; font:var(--t-label); color:#7f1d1d; margin-bottom:var(--s1) }
  .alert .act { margin-top:var(--s2); height:var(--c-sm); padding:0 var(--s3); border-radius:var(--pill); background:#fff; color:#7f1d1d; font:var(--t-label); box-shadow:0 0 0 1px rgba(127,29,29,.2); cursor:pointer } .alert .act:hover { background:#fff1f2 }
  .note { margin-top:var(--s3); font:var(--t-caption); color:var(--muted) } .note.err { color:var(--bad) }
  .li { height:var(--c); display:flex; align-items:center; gap:var(--s2); padding:0 var(--s2); border-radius:var(--r1); font:var(--t-label); cursor:pointer } .li:hover { background:#f3f4f7 } .li.cur { background:var(--accent-bg) }
  .li .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .li .kind { margin-left:auto; flex:none; display:inline-flex; align-items:center; height:20px; padding:0 var(--s2); border-radius:var(--pill); background:var(--fill); color:var(--muted); font:var(--t-caption-strong) }
  .li .rm { color:var(--faint); width:var(--c-sm); height:var(--c-sm); border-radius:var(--r1); display:grid; place-items:center; flex:none } .li .rm:hover { background:var(--fill-2); color:var(--bad) }
  .try { display:inline-flex; align-items:center; height:var(--c-sm); margin:var(--s1) var(--s1) 0 0; padding:0 var(--s3); border-radius:var(--pill); background:var(--fill); font:var(--t-label); cursor:pointer } .try:hover { background:var(--fill-2) }
  .seg { display:inline-flex; background:var(--fill); border-radius:var(--r2); padding:var(--s1); gap:var(--s1) }
  .seg button { height:var(--c-sm); padding:0 var(--s3); border-radius:var(--r1); font:var(--t-label); color:var(--ink-2) } .seg button.on { background:#fff; box-shadow:var(--e1); color:var(--ink) }
  .frow { display:flex; align-items:center; justify-content:space-between; gap:var(--s4); padding:var(--s3) 0; border-top:1px solid var(--line) } .frow:first-of-type { border:0; padding-top:0 }
  .frow label { font:var(--t-label) } .frow small { display:block; font:var(--t-caption); color:var(--muted) }
  .switch { width:40px; height:24px; border-radius:var(--r2); background:#d0d5dd; position:relative; flex:none } .switch::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:var(--e1) }
  .switch.on { background:var(--accent) } .switch.on::after { transform:translateX(16px) }
  #sug { margin-top:var(--s2); border-radius:var(--r2); max-height:200px; overflow:auto; display:none; box-shadow:0 0 0 1px var(--line) inset; padding:var(--s1) }

  #help { right:var(--edge); top:calc(var(--edge) + var(--bar) + var(--s2)); padding:20px; width:368px; max-width:calc(100vw - 2 * var(--edge)); max-height:calc(100vh - var(--edge) - (var(--edge) + var(--bar) + var(--s2))); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; display:none }
  #help.open { display:block } #help h3 { font:var(--t-heading); margin:0 0 var(--s2) }
  #help h4 { font:var(--t-overline); letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin:var(--s4) 0 var(--s2) }
  .hrow { display:grid; grid-template-columns:48px 1fr; gap:var(--s3); align-items:center; padding:var(--s1) 0 }
  .hrow p { margin:0; color:var(--muted) } .hrow p b { color:var(--ink); font-weight:600 }
  .hsw { display:grid; place-items:center; height:36px; border-radius:var(--r2); background:#f6f7f9; color:var(--ink) }
  .hsw .m-head { display:block; width:32px; height:20px; border-radius:6px; background:#6d28d9 }
  .hsw .m-card { display:block; width:34px; height:24px; border-radius:6px; border:2px solid #15803d; background:#dcebe3 }

  .hsw .m-line { display:block; width:32px; border-top:3px solid #15803d } .hsw .m-line.d { border-top-style:dashed }
  #help .keys { display:flex; flex-wrap:wrap; gap:var(--s2) var(--s4); margin:var(--s2) 0 0 60px; color:var(--muted); font:var(--t-caption) }
  #help kbd { display:inline-block; min-width:22px; padding:1px 6px; margin-right:6px; text-align:center; font:var(--t-caption-strong); color:var(--ink); background:#fff; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px }
  #help .keys kbd + kbd { margin-left:-2px }
  #help .htip { display:flex; align-items:flex-start; gap:var(--s3); margin:var(--s4) 0 0; padding:var(--s3) var(--s4); background:var(--accent-bg); border-radius:var(--r2); color:var(--ink-2) }
  #help .htip .i { flex:none; margin-top:2px; color:var(--accent) }
  #empty { position:fixed; inset:0; display:none; place-items:center; color:var(--muted); pointer-events:none; text-align:center; font:var(--t-title); padding:0 20%; z-index:1 }
  #empty small { font:var(--t-body) }
  body.empty #zoom { display:none }
  .note:empty { display:none }
  #toast { position:fixed; left:50%; bottom:var(--edge); transform:translateX(-50%); background:#14141c; color:#fff; height:var(--c); padding:0 var(--s4); border-radius:var(--pill); font:var(--t-label); z-index:20; display:none; align-items:center }
  /* top-right bar: icons only. The label slides open on hover or focus. Touch screens have no hover, so a wide touch screen shows the labels. */
  #zoom .tb { gap:0 } #zoom .tb .badge { margin-left:6px }
  #zoom .tb.icon { width:auto; min-width:var(--c); padding:0 var(--s3) }

<script>
const $ = id => document.getElementById(id), vp = $('viewport'), world = $('world'), edges = $('edges');
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const api = (path, opts = {}) => staticApi(path, opts);  // everything goes to GitHub through the local server
let AUTH = { authed: false };  // does the local server hold a GitHub sign-in (from `gh` or GITHUB_TOKEN)?
const authed = () => AUTH.authed;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = (n, c = '') => `<svg class="i${c ? ' ' + c : ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
// Plain-language explanations. An "i" icon next to a term opens one of these.
const TERMS = {
  commit: ['Commit', 'A saved copy of the code, with a message and an author. Each card on the map is one commit.'],
  branch: ['Branch', 'A separate line of work. You can try a change on a branch while the main code stays safe. Each colored column is a branch.'],
  main: ['Main branch', 'The branch that the project is built on. It is usually named main. It holds the version that everyone accepts. Finished work is merged into it.'],
  merge: ['Merge', 'To join the work of one branch into another branch. Usually, this is a merge into main.'],
  split: ['Split point', 'The commit where a branch started from main.'],
  parent: ['Built on', 'The commit that comes before this commit. Follow these links back to see the history.'],
  hash: ['ID', 'A short code that identifies one commit. The first 7 characters are sufficient to find it.'],
  pr: ['Pull request', 'A request to merge a branch into main. Other people review the work and discuss it first.'],
  conflict: ['Merge conflict', 'Two branches changed the same lines. Git cannot choose between them. A person must choose.'],
  ahead: ['Ahead', 'The commits that this branch has and main does not have. This work waits to be merged.'],
  behind: ['Behind', 'The commits that main received after this branch split off. Merge them into the branch to make it current.'],
  merged: ['Fully merged', 'All the work of this branch is already in main. You can delete the branch.'],
  stale: ['Stale', 'A branch that nobody changed for a long time.'],
  ci: ['CI checks', 'Automatic checks, such as tests, that run on a commit. A green mark shows that the checks passed.'],
  tag: ['Tag', 'A permanent name for one commit. Usually, a tag marks a release, such as v1.0.'],
  forked: ['Forked from', 'The commit on main where this branch started.']
};
const info = k => `<button class="tipbtn" data-term="${k}" aria-label="What is ${TERMS[k][0].toLowerCase()}?">${ico('info')}</button>`;
const setExp = all => { $('expAll').innerHTML = ico(all ? 'fold' : 'unfold', 'lg') + `<span class="lbl">${all ? 'Collapse all' : 'Expand all'}</span>`; $('expAll').title = all ? 'Collapse all' : 'Expand all'; };
const toast = t => { const n = $('toast'); n.textContent = t; n.style.display = 'flex'; clearTimeout(toast.t); toast.t = setTimeout(() => n.style.display = 'none', 1600); };

// ---------- constants ----------
// 8pt grid: every size and gap is a multiple of 8 (card 256x128, row pitch 160, column pitch 320)
const CW = 256, CH = 128, PRH = 120, HEAD_H = 128, COLX = 320, ROWY = 160, GAP = 24, START = 6, UNIT = 8;
const snap = v => Math.round(v / UNIT) * UNIT;
const BASE_COLOR = '#15803d';
// Branch colors: one tonal step (Tailwind "700") across eight hues, so they read as a family. Green is reserved for the main branch;
// red / amber / green are reserved for conflict / warning / OK, so none of these sit in those hues.
const COLORS = ['#6d28d9', '#c2410c', '#0e7490', '#be185d', '#0f766e', '#a21caf', '#475569', '#0369a1'];  // violet, orange, cyan, pink, teal, fuchsia, slate, sky
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? `${m[3]} ${MON[+m[2] - 1]} '${m[1].slice(2)}` : (s || ''); };
const tint = (hex, a = .14) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const AV = ['#64748b', '#475569', '#7c8aa0', '#334155', '#56657a', '#8795a8', '#3f4f66', '#6b7a90'];
const avColor = n => AV[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % AV.length];
const initials = n => (n.match(/\b\w/g) || ['?'])[0].toUpperCase();

}
async function staticApi(path, opts = {}) {
  const u = new URL(path, 'http://local/'), p = u.pathname, q = u.searchParams, post = opts.method === 'POST', body = opts.body ? JSON.parse(opts.body) : {}, list = () => store.get('gc-repos', []);
  if (p === '/api/repos' && post) {
    const src = String(body.source || '').trim(), m = /^(?:https?:\/\/)?(?:www\.)?(?:github\.com\/)?([\w.-]+)\/([\w.-]+?)(?:\.git)?(?:\/.*)?$/.exec(src);
    if (!m || /^[\/~.]/.test(src)) throw new Error('Type owner/repo or paste a github.com link.');
    const info = await repoInfo(`/repos/${m[1]}/${m[2]}`), x = { id: 'gh:' + info.full_name.toLowerCase(), kind: 'github', name: info.full_name, owner: info.owner.login, repo: info.name }, l = list();
    if (!l.some(y => y.id === x.id)) l.push(x); store.set('gc-repos', l); return { repos: l, added: x.id };
  }
  if (p === '/api/repos/remove' && post) { const l = list().filter(y => y.id !== body.id); store.set('gc-repos', l); return { repos: l }; }

    const mx = Math.max(1, Math.min(100, +q.get('max') || 25)), ck = 'gc-cache-' + x.id + '-' + mx + (authed() ? '-t' : ''), hit = post ? null : store.get(ck, null);
    let g; if (hit && Date.now() - hit.t < 600000) g = hit.g; else { g = await buildGraph(x, mx); store.set(ck, { t: Date.now(), g }); }

    const wk = Date.now() / 1000 - 7 * 86400, ctOf = {}; g.lanes.forEach(l => l.commits.forEach(c => { ctOf[c.hash] = c.ct; }));  // NEW = not seen before AND made in the last 7 days
    g.fresh = prev ? cur2.filter(h => !prev.includes(h) && ctOf[h] > wk) : []; if (post || !prev) store.set(key, cur2);

  }

}

// ----- start -----
(async () => {
  try { AUTH = await (await fetch('api/auth')).json(); } catch {}
  setPopMsg();
  try {
    repos = (await api('api/repos')).repos; if (!repos.some(r => r.id === cur)) cur = repos[0] ? repos[0].id : null;
    fillRepos(); renderRepoList();
    const want = new URLSearchParams(location.search).get('repo') || (location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : '');  // shareable link: ?repo=owner/name
    const have = want && repos.find(r => r.name.toLowerCase() === want.toLowerCase());
    if (want && !have) { await addSource(want, $('popmsg'), $('addGo')); }
    else { if (have) { cur = have.id; store.set('gc-repo', cur); fillRepos(); } await openRepo(!have); }
    if (!cur) showStart();
  } catch (e) { showEmpty(esc(e.message)); }
})();
